<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동동 시세 검색</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #f1f5f9; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <!-- 헤더 & 검색 영역 -->
    <header class="max-w-6xl mx-auto text-center mb-8">
        <h1 class="text-3xl font-black text-indigo-400 mb-2">⚡ 동동 시세 검색</h1>
        <p class="text-slate-400 text-sm">번개장터와 중고나라 최신 매물을 한눈에 비교하세요</p>
        
        <div class="mt-6 flex justify-center gap-2 max-w-md mx-auto">
            <input type="text" id="keywordInput" placeholder="검색어를 입력하세요 (예: s24)" 
                class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
            <button onclick="fetchData()" id="searchBtn" 
                class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-3 rounded-xl transition-all whitespace-nowrap">
                시세 조회
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto">
        <!-- 필터 & 개수 표시 컨트롤 바 (기본적으로 숨김 상태) -->
        <div id="filterBar" class="hidden flex-col lg:flex-row justify-between items-start lg:items-center bg-slate-900/90 border border-slate-800 rounded-2xl p-5 mb-8 gap-4 shadow-xl">
            
            <!-- 개수 뱃지 UI -->
            <div class="flex flex-wrap items-center gap-2">
                <span id="resultKeyword" class="text-lg font-bold text-white mr-1"></span>
                <span id="badgeTotal" class="text-xs font-bold px-3 py-1 bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded-full">총 0개</span>
                <span id="badgeBunjang" class="text-xs font-bold px-2.5 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg">번개장터 0개</span>
                <span id="badgeJoongna" class="text-xs font-bold px-2.5 py-1 bg-blue-500/20 text-blue-400 border border-blue-500/30 rounded-lg">중고나라 0개</span>
            </div>

            <!-- 정렬 및 상세 필터 컨트롤 -->
            <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
                <!-- 정렬 선택 -->
                <select id="sortBy" onchange="renderItems()" class="bg-slate-800 border border-slate-700 text-xs text-white rounded-xl px-3 py-2 cursor-pointer focus:outline-none">
                    <option value="recent">최신순</option>
                    <option value="price_asc">낮은 가격순</option>
                    <option value="price_desc">높은 가격순</option>
                </select>

                <!-- 가격 범위 -->
                <div class="flex items-center bg-slate-800 border border-slate-700 rounded-xl px-2 py-1 text-xs">
                    <input type="number" id="minPrice" oninput="renderItems()" placeholder="최소가" class="w-16 bg-transparent text-center text-white focus:outline-none">
                    <span class="text-slate-500">~</span>
                    <input type="number" id="maxPrice" oninput="renderItems()" placeholder="최대가" class="w-16 bg-transparent text-center text-white focus:outline-none">
                </div>

                <!-- 제외 키워드 -->
                <input type="text" id="excludeKeyword" oninput="renderItems()" placeholder="제외할 단어" class="bg-slate-800 border border-slate-700 text-xs text-white rounded-xl px-3 py-2 w-28 focus:outline-none">
            </div>
        </div>

        <!-- 매물 카드 목록 출력 영역 -->
        <div id="itemList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </main>

    <script>
        let rawItems = []; // 백엔드에서 받아온 원본 데이터를 저장할 배열

        // 엔터키 검색 이벤트
        document.getElementById('keywordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') fetchData();
        });

        // 1. 백엔드 API 데이터 호출 함수
        async function fetchData() {
            const keyword = document.getElementById('keywordInput').value.trim();
            if (!keyword) return;

            const searchBtn = document.getElementById('searchBtn');
            searchBtn.innerText = '조회중...';
            searchBtn.disabled = true;

            try {
                const res = await fetch(`https://dongdong-price-139476624338.asia-northeast3.run.app/api/search?keyword=${encodeURIComponent(keyword)}`);
                const data = await res.json();

                // 개수 데이터 및 아이템 파싱
                if (data && data.items) {
                    rawItems = data.items;
                    document.getElementById('badgeTotal').innerText = `총 ${data.totalCount || 0}개`;
                    document.getElementById('badgeBunjang').innerText = `번개장터 ${data.bunjangCount || 0}개`;
                    document.getElementById('badgeJoongna').innerText = `중고나라 ${data.joongnaCount || 0}개`;
                } else if (Array.isArray(data)) {
                    rawItems = data;
                    const bunkCount = rawItems.filter(i => i.platform === '번개장터').length;
                    const joongCount = rawItems.filter(i => i.platform === '중고나라').length;
                    document.getElementById('badgeTotal').innerText = `총 ${rawItems.length}개`;
                    document.getElementById('badgeBunjang').innerText = `번개장터 ${bunkCount}개`;
                    document.getElementById('badgeJoongna').innerText = `중고나라 ${joongCount}개`;
                }

                document.getElementById('resultKeyword').innerText = `'${keyword}' 결과`;
                document.getElementById('filterBar').classList.remove('hidden');
                document.getElementById('filterBar').classList.add('flex');

                // 데이터 정렬/필터링 후 화면 출력
                renderItems();

            } catch (err) {
                alert('데이터를 가져오는 중 오류가 발생했습니다.');
                console.error(err);
            } finally {
                searchBtn.innerText = '시세 조회';
                searchBtn.disabled = false;
            }
        }

        // 2. 화면에 매물 카드 출력 및 실시간 필터/정렬 함수
        function renderItems() {
            const sortBy = document.getElementById('sortBy').value;
            const minPrice = parseInt(document.getElementById('minPrice').value) || 0;
            const maxPrice = parseInt(document.getElementById('maxPrice').value) || Infinity;
            const excludeKeyword = document.getElementById('excludeKeyword').value.trim();

            // 필터링 & 정렬 연산
            let filtered = rawItems
                .filter(item => !excludeKeyword || !item.title.includes(excludeKeyword))
                .filter(item => item.price >= minPrice && item.price <= maxPrice)
                .sort((a, b) => {
                    if (sortBy === 'price_asc') return a.price - b.price;
                    if (sortBy === 'price_desc') return b.price - a.price;
                    return b.createdAt - a.createdAt; // 최신순
                });

            const itemList = document.getElementById('itemList');
            itemList.innerHTML = '';

            if (filtered.length === 0) {
                itemList.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">조건에 맞는 매물이 없습니다.</div>`;
                return;
            }

            // 카드 HTML 생성
            filtered.forEach(item => {
                const card = `
                    <a href="${item.link}" target="_blank" class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-indigo-500/50 transition-all flex flex-col group">
                        <div class="relative aspect-square bg-slate-950 overflow-hidden">
                            <img src="${item.imageUrl || 'https://via.placeholder.com/300?text=No+Image'}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            <span class="absolute top-3 left-3 text-[10px] font-bold px-2 py-1 rounded-md text-white ${item.platformColor}">
                                ${item.platform}
                            </span>
                        </div>
                        <div class="p-4 flex flex-col justify-between flex-1">
                            <h4 class="text-sm text-slate-200 font-medium line-clamp-2 mb-2">${item.title}</h4>
                            <div>
                                <div class="text-lg font-black text-white">${item.price.toLocaleString()}원</div>
                                <div class="text-[11px] text-slate-500 mt-1 flex justify-between">
                                    <span>${item.location}</span>
                                    <span>방금 전</span>
                                </div>
                            </div>
                        </div>
                    </a>
                `;
                itemList.innerHTML += card;
            });
        }
    </script>
</body>
</html>
