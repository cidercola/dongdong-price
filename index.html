<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동동 시세 검색 - REALTIME SECONDHAND MARKET RADAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #080c14; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
        .hero-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(13, 17, 30, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <div>
        <!-- 상단 네비게이션 바 -->
        <nav class="max-w-7xl mx-auto px-6 py-6 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-bolt text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight text-white flex items-center gap-2">
                        동동 시세 검색 <span class="w-2 h-2 rounded-full bg-cyan-400 inline-block animate-pulse"></span>
                    </h1>
                    <p class="text-[11px] font-semibold tracking-wider text-slate-500">REALTIME SECONDHAND MARKET RADAR</p>
                </div>
            </div>
            <div class="text-xs bg-slate-900/80 border border-slate-800 text-slate-400 px-3.5 py-1.5 rounded-full flex items-center gap-2">
                <i class="fa-regular fa-clock text-indigo-400"></i> 실시간 탐색 모드
            </div>
        </nav>

        <!-- 메인 히어로 검색 섹션 -->
        <section class="max-w-5xl mx-auto px-4 mt-2">
            <div class="hero-card rounded-3xl p-8 md:p-12 text-center relative overflow-hidden">
                <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-semibold mb-6">
                    <i class="fa-solid fa-chart-line text-[10px]"></i> 스마트 실시간 시세 탐색기
                </div>
                
                <h2 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight mb-3">
                    실시간 최신 중고 매물을<br>
                    <span class="bg-gradient-to-r from-indigo-300 via-cyan-300 to-indigo-400 bg-clip-text text-transparent">한눈에 비교하고 탐색하세요</span>
                </h2>
                <p class="text-slate-400 text-sm max-w-xl mx-auto mb-8 font-light">
                    번개장터와 중고나라에 방금 올라온 매물들을 수집하여 플랫폼별로 깔끔하게 정렬해 드립니다.
                </p>

                <!-- 검색바 & 플랫폼 선택 -->
                <div class="bg-slate-950/80 border border-slate-800 p-2 rounded-2xl max-w-2xl mx-auto shadow-2xl flex flex-col md:flex-row items-center gap-2">
                    <div class="flex items-center pl-4 pr-2 py-2 w-full">
                        <i class="fa-solid fa-magnifying-glass text-slate-500 mr-3"></i>
                        <input type="text" id="keywordInput" placeholder="검색어를 입력하세요 (예: s24)" 
                            class="w-full bg-transparent text-white text-sm focus:outline-none placeholder:text-slate-600">
                    </div>

                    <!-- 플랫폼 체크박스 -->
                    <div class="flex items-center gap-4 px-3 py-2 text-xs font-medium text-slate-300 whitespace-nowrap border-t md:border-t-0 md:border-l border-slate-800/80 w-full md:w-auto justify-center">
                        <label class="flex items-center gap-2 cursor-pointer hover:text-white transition-colors">
                            <input type="checkbox" id="checkBunjang" checked onchange="renderItems()" class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-0 cursor-pointer">
                            번개장터
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-white transition-colors">
                            <input type="checkbox" id="checkJoongna" checked onchange="renderItems()" class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-0 cursor-pointer">
                            중고나라
                        </label>
                    </div>

                    <button onclick="fetchData()" id="searchBtn" 
                        class="w-full md:w-auto bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-bold px-7 py-3 rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/30 whitespace-nowrap">
                        시세 조회
                    </button>
                </div>

                <!-- 인기 키워드 태그 -->
                <div class="mt-6 flex flex-wrap justify-center items-center gap-2 text-xs text-slate-500">
                    <span class="mr-1">인기 키워드:</span>
                    <button onclick="setKeyword('s24')" class="hover:text-slate-300 font-medium">#s24</button>
                    <button onclick="setKeyword('아이폰 15')" class="hover:text-slate-300 font-medium">#아이폰 15</button>
                    <button onclick="setKeyword('아이패드')" class="hover:text-slate-300 font-medium">#아이패드</button>
                    <button onclick="setKeyword('닌텐도')" class="hover:text-slate-300 font-medium">#닌텐도</button>
                </div>
            </div>
        </section>

        <!-- 검색 결과 영역 -->
        <main class="max-w-7xl mx-auto px-6 mt-12 mb-20">
            <!-- 필터 & 요약 바 (기본 숨김) -->
            <div id="filterBar" class="hidden flex-col gap-4 bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5 mb-8 backdrop-blur-md">
                
                <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                    <!-- 개수 요약 -->
                    <div class="flex flex-wrap items-center gap-3">
                        <span id="resultKeyword" class="text-sm font-bold text-slate-300"></span>
                        <span id="badgeTotal" class="text-xs font-bold text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/20">총 0개</span>
                        <div class="flex items-center gap-2 border-l border-slate-800 pl-3">
                            <span id="badgeBunjang" class="text-[11px] font-semibold text-red-400 bg-red-500/10 px-2.5 py-0.5 rounded-md">번개장터 0개</span>
                            <span id="badgeJoongna" class="text-[11px] font-semibold text-blue-400 bg-blue-500/10 px-2.5 py-0.5 rounded-md">중고나라 0개</span>
                        </div>
                    </div>

                    <!-- 정렬 드롭다운 & 가격 필터 & 제외 키워드 추가 -->
                    <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
                        <!-- 정렬 -->
                        <select id="sortBy" onchange="renderItems()" class="bg-slate-950 border border-slate-800 text-xs text-slate-300 rounded-xl px-3 py-2 focus:outline-none cursor-pointer">
                            <option value="recent">최신순</option>
                            <option value="price_asc">낮은 가격순</option>
                            <option value="price_desc">높은 가격순</option>
                        </select>

                        <!-- 가격 범위 + 적용 버튼 -->
                        <div class="flex items-center bg-slate-950 border border-slate-800 rounded-xl p-1 text-xs">
                            <input type="number" id="minPrice" placeholder="최소가" class="w-16 bg-transparent text-center text-slate-200 focus:outline-none">
                            <span class="text-slate-600">~</span>
                            <input type="number" id="maxPrice" placeholder="최대가" class="w-16 bg-transparent text-center text-slate-200 focus:outline-none">
                            <button onclick="applyPriceFilter()" class="ml-1 bg-slate-800 hover:bg-slate-700 text-indigo-300 px-2.5 py-1 rounded-lg transition-all font-semibold">적용</button>
                        </div>

                        <!-- 제외 키워드 + 추가 버튼 -->
                        <div class="flex items-center bg-slate-950 border border-slate-800 rounded-xl p-1 text-xs">
                            <input type="text" id="excludeInput" placeholder="제외 키워드" class="w-24 bg-transparent pl-2 text-slate-200 focus:outline-none placeholder:text-slate-600">
                            <button onclick="addExcludeKeyword()" class="ml-1 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-lg transition-all font-semibold">추가</button>
                        </div>
                    </div>
                </div>

                <!-- 제외 키워드 태그 리스트 영역 -->
                <div id="excludeTagContainer" class="hidden flex-wrap items-center gap-2 pt-2 border-t border-slate-800/60">
                    <span class="text-xs text-slate-500 font-medium mr-1"><i class="fa-solid fa-filter text-[10px] mr-1"></i>제외된 단어:</span>
                    <div id="excludeTagList" class="flex flex-wrap gap-2"></div>
                </div>
            </div>

            <!-- 매물 카드 그리드 -->
            <div id="itemList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
        </main>
    </div>

    <!-- 하단 푸터 (복구 완료) -->
    <footer class="border-t border-slate-800/80 bg-slate-950/60 py-8 px-6 text-center text-xs text-slate-500 mt-auto">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2 font-semibold text-slate-400">
                <i class="fa-solid fa-bolt text-indigo-500"></i> 동동 시세 검색
            </div>
            <div class="flex items-center gap-4">
                <span>문의 및 서비스 피드백:</span>
                <a href="mailto:support@dongdong.com" class="text-indigo-400 hover:underline flex items-center gap-1.5 font-medium">
                    <i class="fa-regular fa-envelope"></i> contact@dongdong.com
                </a>
            </div>
            <div class="text-slate-600 text-[11px]">
                © 2026 DongDong Price Radar. All rights reserved.
            </div>
        </div>
    </footer>

    <script>
        let rawItems = [];
        let excludeKeywords = [];
        let appliedMinPrice = 0;
        let appliedMaxPrice = Infinity;

        document.getElementById('keywordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') fetchData();
        });

        document.getElementById('excludeInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addExcludeKeyword();
        });

        function setKeyword(val) {
            document.getElementById('keywordInput').value = val;
            fetchData();
        }

        function applyPriceFilter() {
            const minVal = parseInt(document.getElementById('minPrice').value);
            const maxVal = parseInt(document.getElementById('maxPrice').value);
            appliedMinPrice = isNaN(minVal) ? 0 : minVal;
            appliedMaxPrice = isNaN(maxVal) ? Infinity : maxVal;
            renderItems();
        }

        function addExcludeKeyword() {
            const input = document.getElementById('excludeInput');
            const val = input.value.trim();
            if (val && !excludeKeywords.includes(val)) {
                excludeKeywords.push(val);
                input.value = '';
                renderExcludeTags();
                renderItems();
            }
        }

        function removeExcludeKeyword(word) {
            excludeKeywords = excludeKeywords.filter(k => k !== word);
            renderExcludeTags();
            renderItems();
        }

        function renderExcludeTags() {
            const container = document.getElementById('excludeTagContainer');
            const list = document.getElementById('excludeTagList');
            list.innerHTML = '';

            if (excludeKeywords.length === 0) {
                container.classList.add('hidden');
                container.classList.remove('flex');
                return;
            }

            container.classList.remove('hidden');
            container.classList.add('flex');

            excludeKeywords.forEach(word => {
                const tag = `
                    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-red-500/10 border border-red-500/20 text-red-300 text-xs font-medium">
                        ${word}
                        <button onclick="removeExcludeKeyword('${word}')" class="hover:text-red-100 transition-colors">
                            <i class="fa-solid fa-xmark text-[11px]"></i>
                        </button>
                    </span>
                `;
                list.innerHTML += tag;
            });
        }

        async function fetchData() {
            const keyword = document.getElementById('keywordInput').value.trim();
            if (!keyword) return;

            const searchBtn = document.getElementById('searchBtn');
            searchBtn.innerText = '조회 중...';
            searchBtn.disabled = true;

            try {
                const res = await fetch(`https://dongdong-price-139476624338.asia-northeast3.run.app/api/search?keyword=${encodeURIComponent(keyword)}`);
                const data = await res.json();

                if (data && data.items) {
                    rawItems = data.items;
                } else if (Array.isArray(data)) {
                    rawItems = data;
                }

                document.getElementById('resultKeyword').innerText = `'${keyword}' 조회 결과`;
                document.getElementById('filterBar').classList.remove('hidden');
                document.getElementById('filterBar').classList.add('flex');

                renderItems();

            } catch (err) {
                alert('데이터 수집 중 오류가 발생했습니다.');
                console.error(err);
            } finally {
                searchBtn.innerText = '시세 조회';
                searchBtn.disabled = false;
            }
        }

        function renderItems() {
            const checkBunjang = document.getElementById('checkBunjang').checked;
            const checkJoongna = document.getElementById('checkJoongna').checked;
            const sortBy = document.getElementById('sortBy').value;

            let filtered = rawItems.filter(item => {
                if (!checkBunjang && item.platform === '번개장터') return false;
                if (!checkJoongna && item.platform === '중고나라') return false;
                if (item.price < appliedMinPrice || item.price > appliedMaxPrice) return false;
                
                for (let word of excludeKeywords) {
                    if (item.title.includes(word)) return false;
                }
                return true;
            });

            filtered.sort((a, b) => {
                if (sortBy === 'price_asc') return a.price - b.price;
                if (sortBy === 'price_desc') return b.price - a.price;
                return b.createdAt - a.createdAt;
            });

            const bunjangCount = filtered.filter(i => i.platform === '번개장터').length;
            const joongnaCount = filtered.filter(i => i.platform === '중고나라').length;
            
            document.getElementById('badgeTotal').innerText = `총 ${filtered.length}개`;
            document.getElementById('badgeBunjang').innerText = `번개장터 ${bunjangCount}개`;
            document.getElementById('badgeJoongna').innerText = `중고나라 ${joongnaCount}개`;

            const itemList = document.getElementById('itemList');
            itemList.innerHTML = '';

            if (filtered.length === 0) {
                itemList.innerHTML = `<div class="col-span-full text-center py-20 text-slate-500 font-light">조회 조건에 맞는 매물이 없습니다.</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = `
                    <a href="${item.link}" target="_blank" class="bg-slate-900/80 border border-slate-800/80 rounded-2xl overflow-hidden hover:border-indigo-500/50 transition-all flex flex-col group shadow-lg">
                        <div class="relative aspect-square bg-slate-950 overflow-hidden">
                            <img src="${item.imageUrl || 'https://via.placeholder.com/300?text=No+Image'}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            <span class="absolute top-3 left-3 text-[10px] font-bold px-2.5 py-1 rounded-md text-white shadow-md ${item.platformColor}">
                                ${item.platform}
                            </span>
                        </div>
                        <div class="p-4 flex flex-col justify-between flex-1">
                            <h4 class="text-sm text-slate-200 font-medium line-clamp-2 mb-3 leading-snug group-hover:text-indigo-300 transition-colors">${item.title}</h4>
                            <div>
                                <div class="text-base font-extrabold text-white tracking-tight">${item.price.toLocaleString()}원</div>
                                <div class="text-[11px] text-slate-500 mt-2 flex justify-between items-center">
                                    <span><i class="fa-solid fa-location-dot text-[9px] mr-1"></i>${item.location}</span>
                                    <span><i class="fa-regular fa-clock text-[9px] mr-1"></i>방금 전</span>
                                </div>
                            </div>
                        </div>
                    </a>
                `;
                itemList.innerHTML += card;
            });
        }
    </script>
</body>
</html>
