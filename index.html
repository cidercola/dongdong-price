<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동동 시세 검색</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 아이콘 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- 예쁜 웹폰트 (Gmarket Sans) 적용 -->
  <style>
    @font-face {
      font-family: 'GmarketSansMedium';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }
    body {
      font-family: 'GmarketSansMedium', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

  <!-- 헤더 영역 -->
  <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50 py-3">
    <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <!-- 로고 및 사이트 이름 영역 -->
      <div class="flex flex-col items-center md:items-start">
        <h1 class="text-2xl font-extrabold text-indigo-400 flex items-center gap-2 tracking-wide">
          <i class="fa-solid fa-chart-line"></i> 동동 시세 검색
        </h1>
        <p class="text-xs text-gray-400 mt-1 font-light tracking-wider">
          중고 거래 통합 검색 플랫폼
        </p>
      </div>

      <!-- 검색바 -->
      <form id="search-form" class="w-full md:w-1/2 flex gap-2">
        <input 
          type="text" 
          id="search-input" 
          placeholder="검색어를 입력하세요 (예: s24, 아이폰)" 
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm"
          required
        >
        <button 
          type="submit" 
          class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-medium transition flex items-center gap-1 shrink-0 text-sm"
        >
          <i class="fa-solid fa-magnifying-glass"></i> 검색
        </button>
      </form>
    </div>
  </header>

  <!-- 메인 컨텐츠 영역 -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
    <!-- 상태 안내 -->
    <div id="status-container" class="mb-6 flex justify-between items-center text-sm text-gray-400">
      <span id="result-count">검색어를 입력하고 검색 버튼을 눌러주세요. (최근 12시간 데이터 조회)</span>
      <div id="loading-spinner" class="hidden flex items-center gap-2 text-indigo-400 font-medium">
        <i class="fa-solid fa-circle-notch animate-spin"></i> 최근 12시간 이내 상품 수집 중...
      </div>
    </div>

    <!-- 상품 카드 리스트 Grid -->
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    </div>
  </main>

  <!-- 스크립트 로직 -->
  <script>
    function formatRelativeTime(timestamp) {
      if (!timestamp) return "방금 전";
      
      const now = new Date();
      const past = new Date(timestamp > 10000000000 ? timestamp : timestamp * 1000);
      const diffInSeconds = Math.floor((now - past) / 1000);

      if (isNaN(diffInSeconds) || diffInSeconds < 0) return "방금 전";

      const minutes = Math.floor(diffInSeconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);

      if (diffInSeconds < 60) return `${diffInSeconds}초 전`;
      if (minutes < 60) return `${minutes}분 전`;
      if (hours < 24) return `${hours}시간 전`;
      return `${days}일 전`;
    }

    function renderProducts(products) {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';

      if (!products || products.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">최근 12시간 이내에 등록된 상품이 없습니다.</div>`;
        return;
      }

      products.forEach(item => {
        const relativeTime = formatRelativeTime(item.createdAt);
        const formattedPrice = item.price ? item.price.toLocaleString('ko-KR') : '가격 문의';
        const imageUrl = item.imageUrl || 'https://via.placeholder.com/500?text=No+Image';

        const card = document.createElement('a');
        card.href = item.link;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
        card.className = 'bg-gray-800 rounded-xl shadow-md border border-gray-700 overflow-hidden hover:border-indigo-500 hover:-translate-y-1 transition duration-200 flex flex-col cursor-pointer group';

        card.innerHTML = `
          <div class="relative w-full h-48 bg-gray-700 overflow-hidden">
            <img src="${imageUrl}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/500?text=Image+Error'">
            <span class="absolute top-2 left-2 ${item.platformColor} text-white text-xs font-bold px-2 py-1 rounded shadow">
              ${item.platform}
            </span>
          </div>
          
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-medium text-gray-100 line-clamp-2 mb-2 group-hover:text-indigo-400 transition text-sm">
                ${item.title}
              </h3>
              <div class="text-lg font-bold text-white mb-1">
                ${formattedPrice} <span class="text-sm font-normal text-gray-400">원</span>
              </div>
            </div>

            <div class="pt-3 border-t border-gray-700 flex items-center justify-between text-xs text-gray-400 mt-2">
              <span class="truncate max-w-[120px]">
                <i class="fa-solid fa-location-dot mr-1"></i>${item.location || '지역 미지정'}
              </span>
              <span class="font-medium text-gray-400 shrink-0">
                <i class="fa-regular fa-clock mr-1"></i>${relativeTime}
              </span>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    document.getElementById('search-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const keyword = document.getElementById('search-input').value.trim();
      if (!keyword) return;

      const spinner = document.getElementById('loading-spinner');
      const countText = document.getElementById('result-count');

      spinner.classList.remove('hidden');
      countText.innerText = `'${keyword}' 최근 12시간 실시간 데이터 탐색 중...`;

      try {
        const response = await fetch(`https://dongdong-api.onrender.com/api/search?keyword=${encodeURIComponent(keyword)}`);
        if (!response.ok) throw new Error("서버 응답 오류");
        
        const data = await response.json();
        renderProducts(data);
        countText.innerText = `'${keyword}' 12시간 이내 등록 상품 총 ${data.length}개`;
      } catch (error) {
        console.error("데이터 가져오기 실패:", error);
        countText.innerText = "파이썬 서버와 통신에 실패했습니다.";
      } finally {
        spinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
